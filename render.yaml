services:
  - type: web
    name: nwis-sentinel
    runtime: python
    rootDir: NLP/nlp_task_ddr
    buildCommand: pip install -r requirements.txt
    startCommand: python gateway.py --no-browser
    plan: free
    healthCheckPath: /gateway/health
    envVars:
      - key: GOOGLE_API_KEY
        sync: false
